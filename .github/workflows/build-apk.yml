name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RAIWAVE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIWAVE-Android-APK
          path: build-output/RAIWAVE.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.4
          name: "RAIWAVE v1.2.4 Official Release"
          body: |
            ### 🎵 RAIWAVE v1.2.4 — Feel Every Frequency
            **Lead Engineer & Creator:** Kazi Raiyan

            - **Android APK:** Download and install `RAIWAVE.apk` (v1.2.4) on any Android device.
            - **Web & PWA:** [https://raiwave.vercel.app](https://raiwave.vercel.app)
            - **Desktop:** Run `RAIWAVE.exe` with embedded icon and offline mode.
            - **What's New in v1.2.4:**
              - **Permanent Android Background Playback Fix:** Resolved background auto-pause by intercepting WebView window visibility/focus delegates, configuring Desktop Chrome emulation to disable mobile-specific YouTube embed auto-pauses, and securing continuous audio output with Android `AudioManager` AudioFocus and `PowerManager` Partial WakeLock.
              - **Foreground Service Lifecycle Stability:** Re-architected native `MediaNotificationService` bridge to eliminate redundant `startForegroundService` dispatches, preventing Android 12/13/14 `ForegroundServiceStartNotAllowedException` crashes when minimized.
              - **Audio Output & Lockscreen Media Sync:** Seamless native Android 11+ Quick Settings / lockscreen playback controls with synchronized seek bar, track artwork, and background hardware volume key control.
              - **Exact Song Matching & Embed Verification:** 100% verified exact song playback with strict title keyword scoring and embeddability testing.
          files: |
            build-output/RAIWAVE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
