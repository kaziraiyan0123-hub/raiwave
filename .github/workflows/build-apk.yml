name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RAIWAVE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIWAVE-Android-APK
          path: build-output/RAIWAVE.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.5
          name: "RAIWAVE v1.2.5 Official Release"
          body: |
            ### 🎵 RAIWAVE v1.2.5 — Feel Every Frequency
            **Lead Engineer & Creator:** Kazi Raiyan

            - **Android APK:** Download and install `RAIWAVE.apk` (v1.2.5) directly through the in-app updater or web.
            - **Web & PWA:** [https://raiwave.vercel.app](https://raiwave.vercel.app)
            - **Desktop:** Run `RAIWAVE.exe` with embedded icon and offline mode.
            - **What's New in v1.2.5:**
              - **Seamless Instant Playback:** Eliminated playback start glitch and double-loading lag. Tracks now buffer and start playing instantly on first tap.
              - **In-App Mobile Updater & Native Download Engine:** Seamless one-tap APK download and package installer launch directly from Profile Settings (`AndroidMedia.downloadAndInstallApk`), plus full native DownloadManager integration in Android WebView.
              - **True Offline Music Mode:** Fixed offline music download errors with direct device blob downloads and IndexedDB storage. Cached tracks play instantly offline without internet.
              - **Design & Alignment Refinements:** Perfectly centered track title and artist under circular visualizer, removed unwanted notification bell clutter from headers, and cleaned up modal version info.
              - **100% Exact Song Matching:** Verified search resolution with strict Spotify/YouTube metadata scoring to ensure the exact song selected plays every time.
          files: |
            build-output/RAIWAVE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
