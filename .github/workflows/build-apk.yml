name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RAIWAVE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIWAVE-Android-APK
          path: build-output/RAIWAVE.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.7
          name: "RAIWAVE v1.2.7 Official Release"
          body: |
            ### 🎵 RAIWAVE v1.2.7 — Feel Every Frequency
            **Lead Engineer & Creator:** Kazi Raiyan

            - **Android APK:** Download and install `RAIWAVE.apk` (v1.2.7) directly through the in-app updater or web.
            - **Web & PWA:** [https://raiwave.vercel.app](https://raiwave.vercel.app)
            - **Desktop:** Run `RAIWAVE.exe` with embedded icon and offline mode.
            - **What's New in v1.2.7:**
              - **Clean Mobile Screen & Removed Floating Card:** Restricted `AndroidMediaNotificationCard` to desktop/tablets (`hidden md:block`), completely eliminating the in-app floating controller that obstructed mobile views and caused confusing duplicate play/pause buttons.
              - **Permanent Elimination of Song Replacement:** Guarded against premature/spurious YouTube player `ENDED` events during stream transitions in both `youtubePlayer.ts` and `PlayerContext.tsx`. Selecting any song now reliably plays that exact song without being replaced by another track.
              - **Intuitive Mobile Track Tapping:** Tapping an already playing track row or card now seamlessly opens the mobile full player instead of inadvertently pausing playback. Explicit play/pause buttons remain dedicated to playback toggle.
              - **Precision Catalog Cleaning:** Purged ambiguous generic aliases from `PREMAPPED_CATALOG`, ensuring exact artist and title match fidelity.
          files: |
            build-output/RAIWAVE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
